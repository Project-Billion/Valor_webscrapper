name: CD Pipeline

on:
  push:
    branches: [prod]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[A-Z]' '[a-z]')
          IMAGE_ID=ghcr.io/$LOWER_REPO

          docker build -t $IMAGE_ID:latest .
          docker push $IMAGE_ID:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,GITHUB_REPOSITORY

          script: |
            set -e

            echo "Creating scraper directories..."
            mkdir -p ~/scraper/output
            mkdir -p ~/scraper/logs

            echo "Writing environment file..."
            echo "${{ secrets.ENV_FILE_CONTENT }}" > ~/scraper/.env

            echo "Logging into GHCR..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io \
              -u "$GITHUB_ACTOR" \
              --password-stdin

            LOWER_REPO=$(echo "$GITHUB_REPOSITORY" | tr '[A-Z]' '[a-z]')
            IMAGE_ID=ghcr.io/$LOWER_REPO

            echo "Pulling latest image..."
            docker pull "$IMAGE_ID:latest"

            cd ~/scraper

            echo "Creating docker-compose.yml..."

            cat > docker-compose.yml <<EOF
            services:
              webscraper:
                image: $IMAGE_ID:latest
                container_name: scraper
                restart: unless-stopped

                env_file:
                  - .env

                volumes:
                  - ./output:/app/output
                  - ./logs:/app/logs

                networks:
                  - production_valor_network

                ports:
                  - "8000:8000"

            networks:
              production_valor_network:
                external: true
            EOF

            echo "Starting scraper..."

            docker compose pull
            docker compose up -d

            echo "Removing unused images..."
            docker image prune -f

            echo "Scraper status:"
            docker compose ps

            echo "Scraper logs:"
            docker compose logs --tail=50