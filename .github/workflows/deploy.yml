name: CD Pipeline

on:
  push:
    branches: [prod]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$LOWER_REPO

          docker build --no-cache -t $IMAGE_ID:latest .
          docker push $IMAGE_ID:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            mkdir -p ~/scraper/output
            mkdir -p ~/scraper/logs

            echo "${{ secrets.ENV_FILE_CONTENT }}" > ~/scraper/.env

            cd ~/scraper

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            echo "Pulling latest scraper image..."

            docker compose pull

            echo "Starting scraper..."

            docker compose up -d --force-recreate

            echo "Container status:"
            docker compose ps

            echo "Recent logs:"
            docker compose logs --tail=50